<h1>Privacy Policy</h1>
<p>WorldTalk stores account emails/usernames, hashed passwords, guest session tokens (hashed), and public chat messages for history/moderation. IPs may be hashed for abuse prevention and are never shown to other users. Ads (if enabled) never appear inside live chat.</p>
