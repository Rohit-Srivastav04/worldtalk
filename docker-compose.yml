services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: php -S 0.0.0.0:8080 -t public
    ports:
      - "8080:8080"
    volumes:
      - ./:/var/www/html
    env_file: .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      WS_PUBLIC_URL: ws://localhost:2346
      WS_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  websocket:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: php websocket/server.php start
    ports:
      - "2346:2346"
    volumes:
      - ./:/var/www/html
    env_file: .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      WS_HOST: 0.0.0.0
      WS_PORT: 2346
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: worldtalk
      MYSQL_USER: worldtalk
      MYSQL_PASSWORD: worldtalk_secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  mysql_data:
