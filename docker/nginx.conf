server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 8m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        # For php-cli built-in server proxy alternative use php container differently.
        # This compose uses php built-in via separate service; nginx serves static + reverse.
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2)$ {
        expires 7d;
        access_log off;
    }

    location ~ /\. {
        deny all;
    }
}
